[package]
name = "wallflow"
version = "0.1.0"
edition = "2021"
authors = ["Wallflow contributors"]
description = "Local, auditable Wallpaper Engine carousel for Windows"

[lib]
name = "wallflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "dds"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security"] }
